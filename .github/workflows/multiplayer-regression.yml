name: Multiplayer regression

on:
  push:
    branches:
      - main
      - feat/qqnd-authoritative-multiplayer
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static client checks
        run: |
          node --check belote_multiplayer.js
          grep -q 'belote_multiplayer.js' index.html
          grep -q 'wss://api.qqnd.fyi/api/v1/ws' belote_multiplayer.js
          ! grep -q 'RTCPeerConnection' belote_multiplayer.js
          ! grep -q 'game.state.commit' belote_multiplayer.js
          ! grep -q 'game.state.publish' belote_multiplayer.js

      - name: Multiplayer gameplay regression
        run: npm run test:multiplayer

      - name: Card animation handoff regression
        run: npx playwright test tests/animation-regression.spec.mjs --project=chromium
