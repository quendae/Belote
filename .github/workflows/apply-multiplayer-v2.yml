name: Apply multiplayer v2 integration

on:
  push:
    branches:
      - feature/real-p2p-multiplayer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-p2p-multiplayer
          fetch-depth: 0

      - name: Patch Belote client and tests
        run: python3 tools/apply_multiplayer_v2.py

      - name: Finalize multiplayer integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('belote_multiplayer.js')
          s = client.read_text(encoding='utf-8')
          s = s.replace('<button class="action primary" data-mp-action="create">', '<button class="action primary" id="mpCreateButton" data-mp-action="create">')
          s = s.replace('<button class="action primary" data-mp-action="join">', '<button class="action primary" id="mpJoinButton" data-mp-action="join">')
          client.write_text(s, encoding='utf-8')

          html = Path('belote_offline_single.html')
          s = html.read_text(encoding='utf-8')
          s = s.replace('async function isBotControlled(p)', 'function isBotControlled(p)')
          html.write_text(s, encoding='utf-8')

          patcher = Path('tools/apply_multiplayer_v2.py')
          s = patcher.read_text(encoding='utf-8')
          s = s.replace('old_bot = "function nextBot()', 'old_bot = "async function nextBot()')
          patcher.write_text(s, encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          python3 -m py_compile tools/apply_multiplayer_v2.py
          node --check belote_multiplayer.js
          git diff --check
          grep -q 'belote_multiplayer.js' belote_offline_single.html
          ! grep -q 'data-action="new-local"' belote_offline_single.html
          ! grep -q 'setInterval(mpTick,180)' belote_offline_single.html
          ! grep -q 'async function isBotControlled' belote_offline_single.html

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add belote_offline_single.html belote_multiplayer.js package.json tests/design-agent.spec.mjs tests/rules-agent.spec.mjs tools/apply_multiplayer_v2.py
          git commit -m "Integrate signaling-assisted multiplayer v2"
          git push origin HEAD:feature/real-p2p-multiplayer
